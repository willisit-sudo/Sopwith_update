name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            shell: bash
            suffix: ""
            src_package: true

          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            shell: bash
            suffix: ""

          - name: MSYS2 MINGW64
            os: windows-latest
            compiler: gcc
            shell: 'msys2 {0}'
            msystem: mingw64
            msys-env: mingw-w64-x86_64
            suffix: "-win64"

          - name: macOS arm64
            os: macos-latest
            compiler: clang
            shell: bash
            suffix: "-macos-arm64"

        exclude:
          - config:
              name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0' && 'macOS arm64' || '' }}

    steps:
    - name: Install build dependencies (Chocolatey, Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: choco install pandoc

    - name: Install build dependencies (MSYS, Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.config.msystem }}
        path-type: inherit
        update: true
        install: >-
          autotools
          base-devel
          dos2unix
          git
          zip
          ${{ matrix.config.msys-env}}-gcc
          ${{ matrix.config.msys-env}}-python
          ${{ matrix.config.msys-env}}-SDL2

    - name: Install build dependencies (Homebrew, macOS)
      if: runner.os == 'macOS'
      run: brew install -q sdl2 autoconf automake libtool pandoc

    - name: Install build dependencies (apt, Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt -q install libsdl2-dev ${{ matrix.config.compiler }}

    - uses: actions/checkout@v6

    - name: Find Git version
      id: version
      env:
        RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0' }}
      run: |
        if [ "$RELEASE_BUILD" = true ]; then
          VERSION=1.0.0
        elif git describe --exact-match --tags >/dev/null; then
          VERSION=$(git describe --exact-match --tags)
          VERSION=${VERSION/#sdl-sopwith-/}
        else
          VERSION=$(git rev-parse --short HEAD)
          VERSION=git-$VERSION
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "SUFFIXED_VERSION=$VERSION${{ matrix.config.suffix }}" >> $GITHUB_OUTPUT
        # Patch the version in configure.ac:
        sed -i.old "s/\(AC_INIT([^,]*, \)\[[^]]*\], /\1[$VERSION], /" \
            configure.ac

    - name: autogen
      env:
        CC: ${{ matrix.config.compiler }}
      run: |
        ./autogen.sh

    - name: make
      run: make -j8

    - name: Display integration checks
      if: runner.os == 'Linux'
      run: ./tests/run-display-tests.sh

    - name: make check
      run: make check

    - name: autotools distcheck
      if: ${{ matrix.config.src_package }}
      run: |
        # This checks we can go through the entire process of generating
        # a distribution package with autotools, and that the package can
        # be built and installed successfully.
        make -j8 distcheck

    - name: Build source package
      if: ${{ matrix.config.src_package }}
      run: |
        make dist
        mkdir srcdist
        mv *.tar.gz srcdist/

    - name: Package Linux release
      if: ${{ matrix.config.src_package && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0' }}
      run: |
        mkdir linux-dist
        cp src/sopwith README.md COPYING.md AUTHORS linux-dist/
        tar -C linux-dist -czf sopwith-update-linux-x64.tar.gz .

    - name: Upload Linux release package
      if: ${{ matrix.config.src_package && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0' }}
      uses: actions/upload-artifact@v6
      with:
        name: sopwith-release-linux
        path: sopwith-update-linux-x64.tar.gz

    - name: Build package (Windows)
      if: runner.os == 'Windows'
      run: |
        cd pkg/win32
        make

    - name: Upload source package
      if: ${{ matrix.config.src_package }}
      uses: actions/upload-artifact@v6
      with:
        path: "srcdist"
        name: sdl-sopwith-src-${{steps.version.outputs.VERSION}}

    - name: Upload build (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        path: "pkg/win32/staging"
        name: sdl-sopwith-${{steps.version.outputs.SUFFIXED_VERSION}}

  check_style_etc:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -q install clang-format-18
    - uses: actions/checkout@v6
    - name: Check formatting
      if: '!cancelled()'
      run: |
        clang-format-18 -i {src,src/sdl}/*.[ch]
        git diff > formatting-fixes.diff
        if ! grep "" formatting-fixes.diff; then
          rm -f formatting-fixes.diff
        else
          (echo "Formatting errors detected by clang-format. Please run" \
                "\`make format\` or apply formatting-fixes.diff below.";
           echo) >> $GITHUB_STEP_SUMMARY
          false
        fi
    - uses: actions/upload-artifact@v6
      if: '!cancelled()'
      with:
        if-no-files-found: ignore
        name: formatting-fixes.diff
        path: formatting-fixes.diff

  publish_release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0' }}
    needs: [build, check_style_etc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: packages
    - name: Publish v1.0.0
      run: |
        set -eu
        windows=$(find packages -maxdepth 1 -type d -name "sdl-sopwith-*-win64" -print -quit)
        test -f "$windows/sopwith.exe"
        (cd "$windows" && zip -q -r "$RUNNER_TEMP/sopwith-update-windows-x64.zip" .)
        gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "Sopwith Update 1.0.0"  \
          --notes "Updated hangars, factories, fuel tanks and vehicles in the enhanced themes. Includes Linux startup and computer flight fixes. For optional local audio, create a star-wars-audio folder beside the executable and add X-wing Engine.wav, Rebel Laser 1.wav, Imperial Laser 1.wav, and TIE Flyby 1.wav. Select Star Wars artwork and enable Enhanced audio with F10. WAVs are supplied by the player. Linux x64 needs the SDL2 runtime. Windows x64 includes the required DLLs." \
          "$RUNNER_TEMP/sopwith-update-windows-x64.zip" \
          packages/sopwith-release-linux/sopwith-update-linux-x64.tar.gz \
          packages/sdl-sopwith-src-*/*.tar.gz
